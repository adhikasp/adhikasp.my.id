<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 440" width="480" height="440" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <title>Who turns the AI research loop today</title>
  <desc>A loop of six research phases from Epoch AI's taxonomy: Decide, Design, Build, Run, Analyze, Communicate. Build and Run are mostly done by AI agents. Analyze and Communicate are shared. Decide and Design are still mostly human. Recursive self-improvement needs the whole loop, including Decide, to run without humans.</desc>
  <rect width="480" height="440" fill="#fcfcfb"/>
  <text x="16" y="30" font-size="16" font-weight="700" fill="#1f2328">Who turns the research loop today</text>

  <circle cx="240" cy="205" r="125" fill="none" stroke="#c4c4bf" stroke-width="2"/>
  <g fill="#8a8a84">
    <path d="M-6 -6 L7 0 L-6 6 z" transform="translate(302.5 96.7) rotate(30)"/>
    <path d="M-6 -6 L7 0 L-6 6 z" transform="translate(365 205) rotate(90)"/>
    <path d="M-6 -6 L7 0 L-6 6 z" transform="translate(302.5 313.3) rotate(150)"/>
    <path d="M-6 -6 L7 0 L-6 6 z" transform="translate(177.5 313.3) rotate(-150)"/>
    <path d="M-6 -6 L7 0 L-6 6 z" transform="translate(115 205) rotate(-90)"/>
    <path d="M-6 -6 L7 0 L-6 6 z" transform="translate(177.5 96.7) rotate(-30)"/>
  </g>

  <g font-size="14" font-weight="700" text-anchor="middle">
    <rect x="186" y="58" width="108" height="44" rx="22" fill="#fcfcfb" stroke="#eb6834" stroke-width="2.5"/>
    <text x="240" y="85" fill="#1f2328">Decide</text>
    <rect x="300" y="122" width="108" height="44" rx="22" fill="#fcfcfb" stroke="#eb6834" stroke-width="2.5"/>
    <text x="354" y="149" fill="#1f2328">Design</text>
    <rect x="300" y="246" width="108" height="44" rx="22" fill="#2a78d6"/>
    <text x="354" y="273" fill="#ffffff">Build</text>
    <rect x="186" y="308" width="108" height="44" rx="22" fill="#2a78d6"/>
    <text x="240" y="335" fill="#ffffff">Run</text>
    <rect x="72" y="246" width="108" height="44" rx="22" fill="#cfe0f6" stroke="#2a78d6" stroke-width="2"/>
    <text x="126" y="273" fill="#1f2328">Analyze</text>
    <rect x="62" y="122" width="128" height="44" rx="22" fill="#cfe0f6" stroke="#2a78d6" stroke-width="2"/>
    <text x="126" y="149" fill="#1f2328">Communicate</text>
  </g>
  <g font-size="13.5" fill="#4b5260" text-anchor="middle">
    <text x="240" y="198">An agent that can</text>
    <text x="240" y="216">turn every step alone</text>
    <text x="240" y="234">is what RSI means</text>
  </g>

  <g font-size="13.5" fill="#1f2328">
    <rect x="16" y="372" width="22" height="14" rx="7" fill="#2a78d6"/>
    <text x="46" y="384">mostly AI: code, experiments, infra fixes</text>
    <rect x="16" y="394" width="22" height="14" rx="7" fill="#cfe0f6" stroke="#2a78d6" stroke-width="1.5"/>
    <text x="46" y="406">shared: AI drafts, a human checks</text>
    <rect x="16" y="416" width="22" height="14" rx="7" fill="#fcfcfb" stroke="#eb6834" stroke-width="2"/>
    <text x="46" y="428">mostly human: what to work on, novel experiments</text>
  </g>
</svg>
