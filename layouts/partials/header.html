	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
	{{- partial "seo.html" . -}}
	<meta name="color-scheme" content="light dark" />
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
	{{- range slice "syntax.css" "mine.css" }}
	<link rel="stylesheet" href="{{ $.Site.BaseURL }}{{ . }}?v={{ substr (md5 (readFile (printf "static/%s" .))) 0 8 }}" />
	{{- end }}
	<script async defer
		src="https://analytics.umami.is/script.js"
		data-website-id="05fdd7be-3dc3-468c-a30a-fc9ffd198b33"></script>
	<link rel="webmention" href="https://webmention.io/adhikasp.my.id/webmention" />
