icon = "instagram"

[[params.social]]
name = "RSS"
icon = "rss"
url = "/index.xml"
# Tag/taxonomy pages are thin; keep them out of the sitemap and drop their RSS feeds.
[outputs]
taxonomy = ["html"]
term = ["html"]
