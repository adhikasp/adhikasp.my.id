{{- /* Visible site header: brand, nav, theme toggle. */ -}}
<header class="site-header">
	<div class="inner">
		<a class="brand p-author h-card" href="{{ .Site.BaseURL }}" rel="home">
			<img src="{{ .Site.Params.Avatar }}" alt="" width="36" height="36" />
			<span class="brand-text">
				<span class="brand-name">{{ .Site.Title }}</span>
				<span class="brand-tag">{{ .Site.Params.subtitle }}</span>
			</span>
		</a>
		<nav class="site-nav" aria-label="Main">
			<ul>
				{{- $cur := strings.TrimSuffix "/" .RelPermalink -}}
				{{- range .Site.Menus.main }}
				{{- $u := strings.TrimSuffix "/" .URL }}
				<li><a href="{{ .URL }}"{{ if eq $u $cur }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
				{{- end }}
			</ul>
			<button class="theme-toggle" type="button" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
				<span class="icon-moon">{{ partial "icons/moon.svg" . }}</span>
				<span class="icon-sun">{{ partial "icons/sun.svg" . }}</span>
			</button>
		</nav>
	</div>
</header>
