<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 945" width="420" height="945" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
<title>How chatting changed the bot's shape</title>
<desc>Five messages over 29 hours, each next to the shape of the Telegram bot after it. Saturday 11:11, asking for an always-on Claude session connected to Telegram: one bot, one session, live 12:17. 17:55, a screenshot and "can your telegram plugin handle topics like this?": forked at 17:57, topics in but still one session. 18:27, "I want isolated Claude session per topic / DM": a router with a session per topic, working 18:38. Sunday 15:31, "Rewrite to rust if needed. I heard it high perf and safe": each session link goes from 55 MB to 2 MB, live 15:51. 16:01, the agent says "Yes, it's possible, but I'd say no." and I reply "yes go ahead with rewrite": the Rust router goes from 60 MB to 6 MB, live 16:09. Plugin memory falls from 475 MB across 10 Bun processes to about 19 MB for a Rust router and 6 bridges; about 2,000 lines of Rust in under an hour.</desc>
