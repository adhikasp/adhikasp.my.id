baseURL = "https://adhikasp.my.id/"
locale = "en-US"
title = "Adhika Setya Pramudita"
theme = "ink-free"
enableRobotsTXT = false
tableOfContents = true

[services.rss]
# 10 newest items per feed; entries carry the front-matter description (layouts/_default/rss.xml).
# Was -1 (all posts, full rendered content): index.xml hit 5.2 MB and cost ~0.9 s of gzip per fetch on gatotkaca (2026-11-09).
limit = 10

[frontmatter]
# Real content updates only: set `lastmod:` in a post's front matter when it is substantively revised.
# (Git commit dates were stamping every page with the date of a metadata-only commit.)
lastmod = ['lastmod', 'date', 'publishDate']

[_build]
list = 'always'
publishResources = true
render = 'always'

[params]
subtitle = "Collection of thoughts"
homeTitle = "Adhika Setya Pramudita: AI agents, data and self-hosting"
description = "Notes by Adhika Setya Pramudita, a software engineer: AI agents, MCP servers, Hacker News data analysis and self-hosting."
mainSections = ["posts", "link-blog", "notebook"]
wpm = 150
maxTags = 5
mermaidCDN = "https://cdn.jsdelivr.net/npm/mermaid@12.2.0/dist/mermaid.esm.min.mjs"
favicon = "/favicon.svg"
Avatar = "/favicon.svg"

[markup.goldmark.renderer]
unsafe = true

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = false
    hl_Lines = ""
    lineNoStart = 1
    lineNos = false
    lineNumbersInTable = false
    noClasses = false
    tabWidth = 4

  [markup.tableOfContents]
    endLevel = 3
    startLevel = 1

[sitemap]
  changefreq = 'monthly'
  filename = 'sitemap.xml'

[[menu.main]]
name = "Home"
url = "/"
weight = 1

[[menu.main]]
name = "Projects"
url = "/public-service"
weight = 2

[[menu.main]]
name = "About"
url = "/about"
weight = 3

[[params.social]]
name = "Stack Overflow"
url = "https://stackoverflow.com/users/4504053/adhika-setya-pramudita"
icon = "layers"

[[params.social]]
