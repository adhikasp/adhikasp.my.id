<!DOCTYPE html>
<html lang="en">
{{- /* partials/header.html = <head>; partials/head.html = the visible site header */ -}}
{{ partial "header.html" . }}
<body>
	<a class="skip-link" href="#content">Skip to content</a>
	{{ partial "head.html" . }}
	<main id="content" class="wrapper">
		{{ block "main" . }}{{ end }}
	</main>
	{{ partial "footer.html" . }}
</body>
</html>
